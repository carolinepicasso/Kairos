<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KAIRÓS • Finanças Pessoais</title>
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="KAIRÓS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121316;--card-bg:#1a1b20;--card-subtle:#24252c;--border:rgba(255,255,255,.08);--peach:#f7b297;--terracotta:#f09b82;--rose:#e8a598;--pink:#f3b0c3;--magenta:#d887a8;--cream:#fff1e8;--text:#f0f1f5;--text-muted:#a9aebb;--danger:#fb7185;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding-bottom:calc(90px + var(--safe-b))}
button,input,select{font:inherit}
.app-container{width:100%;max-width:480px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;flex-direction:column;gap:16px}
.header{display:flex;align-items:center;padding:8px 0}
.brand-wrap{display:flex;align-items:center;gap:12px}
.logo-svg{width:44px;height:44px;filter:drop-shadow(0 0 10px rgba(247,178,151,.35))}
.brand-title{font-family:'Cinzel',serif;font-size:1.45rem;font-weight:800;letter-spacing:.16em;background:linear-gradient(135deg,var(--peach),var(--pink),var(--magenta));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.brand-sub{font-size:.75rem;color:var(--terracotta);letter-spacing:.14em;text-transform:uppercase}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.input-box{width:100%;background:#14151a;border:1px solid var(--border);border-radius:14px;padding:12px 14px;color:var(--text);font-size:16px;outline:none;transition:border-color .2s}
.input-box:focus{border-color:var(--peach)}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--text-muted)}
.btn-action{background:linear-gradient(135deg,var(--peach),var(--rose),var(--pink));color:#26131b;font-weight:700;font-size:.95rem;border:none;border-radius:14px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,opacity .2s}
.btn-action:active{transform:scale(.98);opacity:.9}
.btn-ghost{background:var(--card-subtle);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;font-weight:500}
.banners{display:flex;flex-direction:column;gap:8px}
.alert-banner{background:linear-gradient(135deg,rgba(247,178,151,.12),rgba(216,135,168,.12));border:1px dashed var(--terracotta);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem}
.alert-banner button{background:var(--terracotta);color:#1a0f12;border:none;padding:8px 12px;border-radius:10px;font-size:.8rem;font-weight:700;cursor:pointer}
.overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:12px 6px;text-align:center}
.stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-size:.95rem;font-weight:700;margin-top:4px}
.c-in{color:var(--peach)}.c-out{color:var(--pink)}.c-net{color:var(--cream)}
.section-title{font-size:.9rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.item-list{display:flex;flex-direction:column;gap:10px}
.tx-item{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tx-info{min-width:0}
.tx-desc{font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.tx-meta{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.tx-val{font-weight:700;font-size:.95rem}
.tx-btns{display:flex;gap:2px}
.ico{background:none;border:none;font-size:.95rem;padding:6px;cursor:pointer;opacity:.75}
.goal-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.goal-header{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem}
.bar-bg{background:#14151a;height:8px;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;transition:width .3s ease;background:linear-gradient(90deg,var(--peach),var(--pink))}
.bar-fill.bar-alert{background:linear-gradient(90deg,var(--pink),var(--danger))}
.goal-actions{display:flex;gap:8px;margin-top:4px}
.btn-small{flex:1;padding:8px;background:var(--card-subtle);border:1px solid var(--border);color:var(--text);font-size:.8rem;border-radius:10px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(65px + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(18,19,22,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;max-width:480px;margin:0 auto;z-index:99}
.nav-btn{background:none;border:none;color:var(--text-muted);font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:color .2s;padding:6px 10px}
.nav-btn[aria-current="page"]{color:var(--peach);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:flex;flex-direction:column;gap:16px}
.empty-state{text-align:center;color:var(--text-muted);padding:24px;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:16px}
.modal.open{display:flex}
.modal form{width:100%;max-width:480px;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:var(--safe-b)}
.modal h3{font-size:1rem;color:var(--peach)}
.modal .msg{font-size:.9rem;color:var(--text-muted)}
.modal .fields{display:flex;flex-direction:column;gap:10px}
.modal .row{display:flex;gap:10px}.modal .row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(85px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--card-subtle);border:1px solid var(--terracotta);color:var(--text);padding:10px 16px;border-radius:14px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app-container">
  <header class="header">
    <div class="brand-wrap">
      <svg class="logo-svg" viewBox="0 0 100 100" aria-hidden="true">
        <defs><linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f7b297"/><stop offset="50%" stop-color="#f3b0c3"/><stop offset="100%" stop-color="#d887a8"/></linearGradient></defs>
        <path d="M 28 20 L 28 80" stroke="url(#kg)" stroke-width="8" stroke-linecap="round"/>
        <path d="M 32 50 C 45 40, 60 25, 74 24 C 70 40, 52 48, 38 52" fill="url(#kg)" opacity="0.9"/>
        <path d="M 38 48 C 52 52, 70 60, 74 76 C 60 75, 45 60, 32 50" fill="url(#kg)" opacity="0.9"/>
        <circle cx="50" cy="50" r="4" fill="#fff1e8"/>
      </svg>
      <div><div class="brand-title">KAIRÓS</div><div class="brand-sub">καιρός • o tempo oportuno</div></div>
    </div>
  </header>

  <div id="banners" class="banners"></div>

  <div id="tab-home" class="tab-content active">
    <form id="quick" class="card">
      <input type="text" id="raw-input" class="input-box" aria-label="Lançamento rápido" placeholder="Ex: almoço 35, uber 18,50, guardar 100 reserva" autocomplete="off">
      <select id="acc-sel" class="input-box" aria-label="Conta do lançamento"></select>
      <button type="submit" class="btn-action">Lançar ✨</button>
    </form>
    <div class="overview-grid">
      <div class="stat-card"><div class="stat-label">Entradas (mês)</div><div class="stat-val c-in" id="sum-in"></div></div>
      <div class="stat-card"><div class="stat-label">Saídas (mês)</div><div class="stat-val c-out" id="sum-out"></div></div>
      <div class="stat-card"><div class="stat-label">Saldo total</div><div class="stat-val c-net" id="sum-net"></div></div>
    </div>
    <div class="section-title">Últimos Movimentos</div>
    <div class="item-list" id="home-tx-list"></div>
  </div>

  <div id="tab-goals" class="tab-content">
    <div class="section-title">Poupança & Objetivos</div>
    <div class="item-list" id="savings-list"></div>
    <button class="btn-action" data-act="new-goal">+ Criar Meta de Poupança</button>
    <div class="section-title" style="margin-top:12px">Tetos de Gastos (mês atual)</div>
    <div class="item-list" id="budgets-list"></div>
    <button class="btn-action" data-act="new-budget">+ Criar Teto Mensal</button>

  <div id="tab-accounts" class="tab-content">

    <button class="btn-action" data-act="new-acc">+ Nova Conta</button>
    <div class="section-title" style="margin-top:12px">Contas Mensais (assinaturas, boletos)</div>
    <div class="item-list" id="rec-list"></div>
    <button class="btn-action" data-act="new-rec">+ Nova Conta Mensal</button>
    <div class="section-title" style="margin-top:12px">Salários Programados</div>
    <div class="card">
      <label class="lbl">Dia 5: Salário principal (R$)<input id="sal-day-5" class="input-box" inputmode="decimal" placeholder="Ex: 3500"></label>
      <label class="lbl">Dia 15: Adiantamento / Vale (R$)<input id="sal-day-15" class="input-box" inputmode="decimal" placeholder="Ex: 2000"></label>
      <button class="btn-action" data-act="save-sal">Salvar configurações</button>
    </div>
  </div>

  <div id="tab-cards" class="tab-content">
    <div class="section-title">Cartões de Crédito</div>
    <div class="item-list" id="cards-list"></div>
    <button class="btn-action" data-act="new-card">+ Novo Cartão</button>
    <div class="section-title" style="margin-top:12px">Compras Parceladas</div>
    <div class="item-list" id="parcels-list"></div>
    <button class="btn-action" data-act="new-parc">+ Nova Compra Parcelada</button>
  </div>

  <div id="tab-history" class="tab-content">
    <div class="section-title">Histórico Completo</div>
    <div class="overview-grid" style="grid-template-columns:1fr 1fr 1fr">
      <button class="btn-ghost" data-act="csv">CSV</button>
      <button class="btn-ghost" data-act="json">Backup</button>
      <button class="btn-ghost" data-act="import">Importar</button>

    <input type="file" id="file-in" accept="application/json,.json" hidden>

</div>

<nav class="bottom-nav" aria-label="Navegação principal">
  <button class="nav-btn" data-tab="home" aria-current="page"><span aria-hidden="true">✨</span><span>Início</span></button>
  <button class="nav-btn" data-tab="goals"><span aria-hidden="true">🎯</span><span>Metas</span></button>
  <button class="nav-btn" data-tab="accounts"><span aria-hidden="true">🏦</span><span>Contas</span></button>
  <button class="nav-btn" data-tab="cards"><span aria-hidden="true">💳</span><span>Cartões</span></button>
  <button class="nav-btn" data-tab="history"><span aria-hidden="true">📜</span><span>Histórico</span></button>
</nav>

<div id="modal" class="modal" role="dialog" aria-modal="true">
  <form id="modal-form"><h3></h3><p class="msg"></p><div class="fields"></div>
    <div class="row"><button type="button" class="btn-ghost" data-act="close">Cancelar</button><button type="submit" class="btn-action">Confirmar</button></div>
  </form>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
const KEY = 'kairos_fin_data_v3', OLD = 'kairos_fin_data_v2';
const $ = id => document.getElementById(id);
const brl = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nowIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mes = () => nowIso().slice(0, 7);
const fmtTs = ts => `${ts.slice(8, 10)}/${ts.slice(5, 7)}/${ts.slice(0, 4)} às ${ts.slice(11, 16)}`;
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
const toCents = v => Math.round((Number(v) || 0) * 100);
const centsToInput = c => c > 0 ? (c / 100).toFixed(2).replace('.', ',') : '';

// Dinheiro sempre em centavos (inteiros). Aceita 35, 18.50, 18,50, 1.500, 1.500,90
function parseMoney(str) {
  let s = String(str).replace(/r\$/ig, '').replace(/\s/g, '').replace(/[.,]+$/, '');
  if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? Math.round(n * 100) : 0;
}

const def = () => ({
  transactions: [],
  accounts: [{ id: 'acc1', nome: 'Conta Principal', saldo: 0 }],
  sel: 'acc1',
  salaries: { day5: 0, day15: 0, credited: [] },
  savings: [],
  budgets: [{ id: 'b1', categoria: 'Alimentação', limite: 60000 }],
  cards: [], parcels: [], recurring: []
});

function migrate(o) {
  const d = def();
  if (o.accounts && o.accounts.length) d.accounts = o.accounts.map(a => ({ id: a.id, nome: a.nome, saldo: toCents(a.saldo) }));
  d.sel = d.accounts[0].id;
  d.savings = (o.savings || []).map(s => ({ id: s.id, nome: s.nome, atual: toCents(s.atual), alvo: toCents(s.alvo) }));
  d.budgets = (o.budgets || []).map(b => ({ id: b.id, categoria: b.categoria, limite: toCents(b.limite) }));
  d.salaries.day5 = toCents(o.salaries && o.salaries.day5);
  d.salaries.day15 = toCents(o.salaries && o.salaries.day15);
  d.transactions = (o.transactions || []).map(t => {
    const [dd, mm, yy] = (t.data || '').split('/');
    return { id: t.id, ts: yy ? `${yy}-${mm}-${dd}T${t.hora || '00:00'}` : nowIso(), desc: t.desc, valor: toCents(t.valor), tipo: t.tipo, categoria: t.categoria, acc: d.accounts[0].id };
  });
  return d;
}

function sanitize(p) {
  const d = def();
  const r = { ...d, ...p, salaries: { ...d.salaries, ...(p.salaries || {}) } };
  if (!Array.isArray(r.transactions)) r.transactions = [];
  if (!Array.isArray(r.accounts) || !r.accounts.length) r.accounts = d.accounts;
  if (!Array.isArray(r.savings)) r.savings = [];
  if (!Array.isArray(r.budgets)) r.budgets = [];
  ['cards', 'parcels', 'recurring'].forEach(k => { if (!Array.isArray(r[k])) r[k] = []; });
  if (!Array.isArray(r.salaries.credited)) r.salaries.credited = [];
  if (!r.accounts.some(a => a.id === r.sel)) r.sel = r.accounts[0].id;
  return r;
}

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) return sanitize(JSON.parse(s));
    const o = localStorage.getItem(OLD);
    if (o) return migrate(JSON.parse(o));
  } catch (e) {}
  return def();
}

let D = load();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch (e) { toast('Não consegui salvar. Faça um backup agora!'); }
  render();
}

function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}

// Modal próprio (substitui prompt/alert/confirm)
let modalOk = null;
function modal(title, fields, ok, msg) {
  const m = $('modal');
  m.querySelector('h3').textContent = title;
  m.querySelector('.msg').textContent = msg || '';
  m.querySelector('.msg').style.display = msg ? '' : 'none';
  m.querySelector('.fields').innerHTML = fields.map(f => f.opts ? `<label class="lbl">${esc(f.label)}<select class="input-box" name="${f.key}">${f.opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></label>` :
    `<label class="lbl">${esc(f.label)}<input class="input-box" name="${f.key}" ${f.money ? 'inputmode="decimal"' : ''} value="${esc(f.value == null ? '' : f.value)}" autocomplete="off"></label>`).join('');
  modalOk = ok; m.classList.add('open');
  const first = m.querySelector('input'); if (first) first.focus();
}
const closeModal = () => $('modal').classList.remove('open');

function applyTx(t, s) {
  const a = D.accounts.find(x => x.id === t.acc);
  if (t.tipo === 'Receita' && a) a.saldo += s * t.valor;
  else if (t.tipo === 'Despesa' && a) a.saldo -= s * t.valor;
  else if (t.tipo === 'Transferência') {
    if (a) a.saldo -= s * t.valor;
    const g = D.savings.find(x => x.id === t.goal);
    if (g) g.atual += s * t.valor;
  }
}
function addTx(t) { t.id = uid(); t.ts = nowIso(); applyTx(t, 1); D.transactions.unshift(t); }

const CATS = [
  ['Alimentação', ['almoco', 'jantar', 'ifood', 'lanche', 'mercado', 'padaria', 'restaurante', 'cafe']],
  ['Transporte', ['uber', 'gasolina', 'posto', 'onibus', 'metro', 'estacionamento']],
  ['Moradia', ['aluguel', 'condominio', 'luz', 'agua', 'internet']],
  ['Lazer', ['cinema', 'netflix', 'spotify', 'bar ', 'show']],
  ['Saúde', ['farmacia', 'remedio', 'consulta', 'exame']]
];

function parseNLP(str) {
  const ms = [...str.matchAll(/\d[\d.,]*/g)];
  if (!ms.length) return null;
  const m = ms[ms.length - 1];
  const valor = parseMoney(m[0]);
  if (!valor) return null;
  const desc = (str.slice(0, m.index) + ' ' + str.slice(m.index + m[0].length)).replace(/r\$/ig, '').replace(/\s+/g, ' ').trim() || 'Lançamento';
  const n = norm(desc) + ' ';
  let tipo = 'Despesa', cat = 'Outros';
  if (/\b(guardar|guardei|poupar|aporte|meta)\b/.test(n)) { tipo = 'Transferência'; cat = 'Metas'; }
  else if (/\b(salario|recebi|recebido|adiantamento|freelance|rendimento|reembolso)\b/.test(n)) { tipo = 'Receita'; cat = 'Renda'; }
  else { for (const [c, ws] of CATS) if (ws.some(w => n.includes(w))) { cat = c; break; } }
  return { valor, desc, tipo, cat };
}

function findGoal(desc) {
  const words = norm(desc).split(/\s+/).filter(w => w.length >= 3 && !['guardar', 'guardei', 'poupar', 'aporte', 'meta', 'para', 'pra'].includes(w));
  const hit = D.savings.find(g => words.some(w => norm(g.nome).includes(w)));
  if (hit) return hit;
  return D.savings.length === 1 && !words.length ? D.savings[0] : null;
}

const gasto = b => D.transactions
  .filter(t => t.tipo === 'Despesa' && t.ts.startsWith(mes()) && norm(t.categoria) === norm(b.categoria))
  .reduce((a, t) => a + t.valor, 0);

function lancar() {
  const input = $('raw-input');
  const r = parseNLP(input.value);
  if (!r) return toast('Digite uma descrição e um valor (ex: almoço 35).');
  const t = { desc: r.desc, valor: r.valor, tipo: r.tipo, categoria: r.cat, acc: D.sel };
  if (r.tipo === 'Transferência') {
    const g = findGoal(r.desc);
    if (!g) return toast('Não achei essa meta. Ex: guardar 100 reserva');
    t.goal = g.id; t.desc = 'Aporte: ' + g.nome;
  }
  if (navigator.vibrate) navigator.vibrate(20);
  addTx(t);
  input.value = '';
  save();
  if (r.tipo === 'Despesa') {
    const b = D.budgets.find(x => norm(x.categoria) === norm(r.cat));
    if (b && gasto(b) > b.limite) toast(`Você passou do teto de ${b.categoria}!`);
  }
}

function pendentes() {
  const day = new Date().getDate(), ym = mes();
  return [[5, D.salaries.day5, 'Salário do dia 5'], [15, D.salaries.day15, 'Vale do dia 15']]
    .filter(([n, v]) => day >= n && v > 0 && !D.salaries.credited.includes(ym + '-' + n))
    .map(([n, v, l]) => ({ k: ym + '-' + n, v, l }));
}

function render() {
  const ym = mes();
  const accName = id => { const a = D.accounts.find(x => x.id === id); return a ? a.nome : 'Conta removida'; };
  let tin = 0, tout = 0;
  D.transactions.forEach(t => {
    if (!t.ts.startsWith(ym)) return;
    if (t.tipo === 'Receita') tin += t.valor;
    if (t.tipo === 'Despesa') tout += t.valor;
  });
  $('sum-in').textContent = brl(tin);
  $('sum-out').textContent = brl(tout);
  $('sum-net').textContent = brl(D.accounts.reduce((a, c) => a + c.saldo, 0));

  $('banners').innerHTML = pendentes().map(p => `<div class="alert-banner"><span>${esc(p.l)}: ${brl(p.v)}</span><button data-act="credit" data-id="${p.k}">Creditar ✨</button></div>`).join('') +
    D.recurring.filter(r => r.dia <= new Date().getDate() && !recPago(r)).map(r => `<div class="alert-banner"><span>${esc(r.nome)}: ${brl(r.valor)} (dia ${r.dia})</span><button data-act="pay-rec" data-id="${r.id}">Pagar</button></div>`).join('');

  $('acc-sel').innerHTML = D.accounts.map(a => `<option value="${esc(a.id)}" ${a.id === D.sel ? 'selected' : ''}>${esc(a.nome)}</option>`).join('');

  const txHtml = t => {
    const sign = t.tipo === 'Receita' ? '+' : t.tipo === 'Despesa' ? '-' : '→';
    const cls = t.tipo === 'Receita' ? 'c-in' : t.tipo === 'Despesa' ? 'c-out' : 'c-net';
    return `<div class="tx-item"><div class="tx-info"><div class="tx-desc">${esc(t.desc)}</div><div class="tx-meta">${fmtTs(t.ts)} • ${esc(t.categoria)} • ${esc(accName(t.acc))}</div></div>
      <div class="tx-right"><div class="tx-val ${cls}">${sign} ${brl(t.valor)}</div><div class="tx-btns">
      <button class="ico" data-act="edit-tx" data-id="${t.id}" aria-label="Editar lançamento">✏️</button>
      <button class="ico" data-act="del-tx" data-id="${t.id}" aria-label="Excluir lançamento">🗑️</button></div></div></div>`;
  };
  $('home-tx-list').innerHTML = D.transactions.slice(0, 5).map(txHtml).join('') || '<div class="empty-state">Nenhum movimento recente.</div>';
  $('all-tx-list').innerHTML = D.transactions.map(txHtml).join('') || '<div class="empty-state">Nenhum movimento registrado.</div>';

  $('accounts-list').innerHTML = D.accounts.map(a => `<div class="tx-item"><div class="tx-desc">${esc(a.nome)}</div><div class="tx-right"><div class="tx-val c-net">${brl(a.saldo)}</div><div class="tx-btns"><button class="ico" data-act="edit-acc" data-id="${a.id}" aria-label="Editar conta">✏️</button></div></div></div>`).join('');

  $('savings-list').innerHTML = D.savings.map(s => `<div class="goal-card">
    <div class="goal-header"><span>${esc(s.nome)}</span><span>${brl(s.atual)} / ${brl(s.alvo)}</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct(s.atual, s.alvo)}%"></div></div>
    <div class="goal-actions"><button class="btn-small" data-act="aporte" data-id="${s.id}">+ Guardar</button><button class="btn-small" data-act="edit-goal" data-id="${s.id}">Editar</button><button class="btn-small" data-act="del-goal" data-id="${s.id}">Excluir</button></div></div>`).join('') || '<div class="empty-state">Nenhuma meta ainda.</div>';

  $('budgets-list').innerHTML = D.budgets.map(b => {
    const g = gasto(b);
    return `<div class="goal-card">
    <div class="goal-header"><span>${esc(b.categoria)}</span><span>${brl(g)} / ${brl(b.limite)}</span></div>
    <div class="bar-bg"><div class="bar-fill ${g > b.limite ? 'bar-alert' : ''}" style="width:${pct(g, b.limite)}%"></div></div>
    <div class="goal-actions"><button class="btn-small" data-act="edit-budget" data-id="${b.id}">Editar</button><button class="btn-small" data-act="del-budget" data-id="${b.id}">Excluir</button></div></div>`;
  }).join('') || '<div class="empty-state">Nenhum teto ainda.</div>';
  renderExtra();
}

const parcela = p => Math.round(p.total / p.n);
const usado = c => D.parcels.filter(p => p.card === c.id).reduce((a, p) => a + parcela(p) * (p.n - p.pagas), 0);
const fatura = c => D.parcels.filter(p => p.card === c.id && p.pagas < p.n).reduce((a, p) => a + parcela(p), 0);
const cardName = id => (D.cards.find(c => c.id === id) || { nome: 'Cartão removido' }).nome;
const recPago = r => r.paid.includes(mes());
const dia = x => { const n = parseInt(x, 10); return n >= 1 && n <= 31 ? n : 0; };
const signed = s => /^\s*-/.test(s) ? -parseMoney(String(s).replace('-', '')) : parseMoney(s);
const btn = (a, id, t) => `<button class="btn-small" data-act="${a}" data-id="${id}">${t}</button>`;

function renderExtra() {
  $('cards-list').innerHTML = D.cards.map(c => {
    const u = usado(c);
    return `<div class="goal-card"><div class="goal-header"><span>💳 ${esc(c.nome)}</span><span>Fatura ${brl(fatura(c))}</span></div>
    <div class="bar-bg"><div class="bar-fill ${u > c.limite ? 'bar-alert' : ''}" style="width:${pct(u, c.limite)}%"></div></div>
    <div class="tx-meta">Usado ${brl(u)} de ${brl(c.limite)} • Disponível ${brl(c.limite - u)}<br>Fecha dia ${c.fecha} • Vence dia ${c.vence}</div>
    <div class="goal-actions">${btn('pay-fat', c.id, 'Pagar fatura')}${btn('edit-card', c.id, 'Editar')}${btn('del-card', c.id, 'Excluir')}</div></div>`;
  }).join('') || '<div class="empty-state">Nenhum cartão ainda.</div>';

  $('parcels-list').innerHTML = D.parcels.map(p => `<div class="tx-item"><div class="tx-info"><div class="tx-desc">${esc(p.desc)}</div>
    <div class="tx-meta">${esc(cardName(p.card))} • ${p.pagas >= p.n ? 'quitada ✅' : `${p.pagas}/${p.n} pagas • restam ${brl(parcela(p) * (p.n - p.pagas))}`}</div></div>
    <div class="tx-right"><div class="tx-val c-out">${brl(parcela(p))}/mês</div><div class="tx-btns">
    <button class="ico" data-act="edit-parc" data-id="${p.id}" aria-label="Editar compra">✏️</button>
    <button class="ico" data-act="del-parc" data-id="${p.id}" aria-label="Excluir compra">🗑️</button></div></div></div>`).join('') || '<div class="empty-state">Nenhuma compra parcelada.</div>';

  $('rec-list').innerHTML = D.recurring.map(r => `<div class="tx-item"><div class="tx-info"><div class="tx-desc">${esc(r.nome)}</div>
    <div class="tx-meta">Todo dia ${r.dia} • ${esc(r.cat)} • ${recPago(r) ? 'pago neste mês ✅' : 'em aberto'}</div></div>
    <div class="tx-right"><div class="tx-val c-out">${brl(r.valor)}</div><div class="tx-btns">
    ${recPago(r) ? '' : `<button class="ico" data-act="pay-rec" data-id="${r.id}" aria-label="Pagar">💸</button>`}
    <button class="ico" data-act="edit-rec" data-id="${r.id}" aria-label="Editar conta mensal">✏️</button>
    <button class="ico" data-act="del-rec" data-id="${r.id}" aria-label="Excluir conta mensal">🗑️</button></div></div></div>`).join('') || '<div class="empty-state">Nenhuma conta mensal.</div>';
}

function trocarAba(id) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.toggle('active', el.id === 'tab-' + id));
  document.querySelectorAll('.nav-btn').forEach(el => {
    if (el.dataset.tab === id) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}

function baixar(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const hoje = () => nowIso().slice(0, 10);

function csvCell(v) {
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

const actions = {
  close: closeModal,
  'new-goal': () => modal('Nova meta', [{ key: 'nome', label: 'Nome da meta (ex: Viagem)' }, { key: 'alvo', label: 'Valor alvo (R$)', money: true }], v => {
    const alvo = parseMoney(v.alvo);
    if (!v.nome.trim() || !alvo) return false;
    D.savings.push({ id: uid(), nome: v.nome.trim(), atual: 0, alvo }); save();
  }),
  'new-budget': () => modal('Novo teto mensal', [{ key: 'cat', label: 'Categoria (ex: Alimentação, Lazer)' }, { key: 'lim', label: 'Limite mensal (R$)', money: true }], v => {
    const limite = parseMoney(v.lim);
    if (!v.cat.trim() || !limite) return false;
    D.budgets.push({ id: uid(), categoria: v.cat.trim(), limite }); save();
  }),
  'new-acc': () => modal('Nova conta', [{ key: 'nome', label: 'Nome da conta' }, { key: 'saldo', label: 'Saldo inicial (R$)', money: true }], v => {
    if (!v.nome.trim()) return false;
    D.accounts.push({ id: uid(), nome: v.nome.trim(), saldo: parseMoney(v.saldo) }); save();
  }),
  aporte: id => {
    const g = D.savings.find(x => x.id === id); if (!g) return;
    modal('Guardar em ' + g.nome, [{ key: 'v', label: 'Quanto quer guardar? (R$)', money: true }], v => {
      const valor = parseMoney(v.v); if (!valor) return false;
      addTx({ desc: 'Aporte: ' + g.nome, valor, tipo: 'Transferência', categoria: 'Metas', acc: D.sel, goal: g.id }); save();
    });
  },
  'del-goal': id => modal('Excluir meta?', [], () => { D.savings = D.savings.filter(x => x.id !== id); save(); }, 'Os lançamentos antigos continuam no histórico.'),
  'del-budget': id => modal('Excluir teto?', [], () => { D.budgets = D.budgets.filter(x => x.id !== id); save(); }),
  'edit-tx': id => {
    const t = D.transactions.find(x => x.id === id); if (!t) return;
    modal('Editar lançamento', [{ key: 'desc', label: 'Descrição', value: t.desc }, { key: 'valor', label: 'Valor (R$)', money: true, value: centsToInput(t.valor) }], v => {
      const valor = parseMoney(v.valor); if (!valor || !v.desc.trim()) return false;
      applyTx(t, -1); t.desc = v.desc.trim(); t.valor = valor; applyTx(t, 1); save();
    });
  },
  'del-tx': id => {
    const t = D.transactions.find(x => x.id === id); if (!t) return;
    modal('Excluir lançamento?', [], () => { applyTx(t, -1); D.transactions = D.transactions.filter(x => x.id !== id); save(); }, 'O saldo da conta (e da meta, se for aporte) volta ao que era antes.');
  },
  credit: k => {
    const p = pendentes().find(x => x.k === k); if (!p) return;
    addTx({ desc: p.l, valor: p.v, tipo: 'Receita', categoria: 'Renda', acc: D.sel });
    D.salaries.credited.push(k); save();
  },
  'save-sal': () => {
    D.salaries.day5 = parseMoney($('sal-day-5').value);
    D.salaries.day15 = parseMoney($('sal-day-15').value);
    save(); toast('Salários salvos!');
  },
  'edit-acc': id => {
    const a = D.accounts.find(x => x.id === id); if (!a) return;
    modal('Editar conta', [{ key: 'nome', label: 'Nome da conta', value: a.nome }, { key: 'saldo', label: 'Saldo atual (R$)', money: true, value: (a.saldo / 100).toFixed(2).replace('.', ',') }], v => {
      if (!v.nome.trim()) return false;
      a.nome = v.nome.trim(); a.saldo = signed(v.saldo); save();
    });
  },
  'edit-goal': id => {
    const g = D.savings.find(x => x.id === id); if (!g) return;
    modal('Editar meta', [{ key: 'nome', label: 'Nome da meta', value: g.nome }, { key: 'alvo', label: 'Valor alvo (R$)', money: true, value: centsToInput(g.alvo) }], v => {
      const alvo = parseMoney(v.alvo); if (!v.nome.trim() || !alvo) return false;
      g.nome = v.nome.trim(); g.alvo = alvo; save();
    });
  },
  'edit-budget': id => {
    const b = D.budgets.find(x => x.id === id); if (!b) return;
    modal('Editar teto', [{ key: 'cat', label: 'Categoria', value: b.categoria }, { key: 'lim', label: 'Limite mensal (R$)', money: true, value: centsToInput(b.limite) }], v => {
      const limite = parseMoney(v.lim); if (!v.cat.trim() || !limite) return false;
      b.categoria = v.cat.trim(); b.limite = limite; save();
    });
  },
  'new-card': () => actions.cardForm(),
  'edit-card': id => actions.cardForm(D.cards.find(x => x.id === id)),
  cardForm: c => modal(c ? 'Editar cartão' : 'Novo cartão', [
    { key: 'nome', label: 'Nome do cartão (ex: Nubank)', value: c ? c.nome : '' },
    { key: 'lim', label: 'Limite (R$)', money: true, value: c ? centsToInput(c.limite) : '' },
    { key: 'fecha', label: 'Dia do fechamento', value: c ? c.fecha : '' },
    { key: 'vence', label: 'Dia do vencimento', value: c ? c.vence : '' }], v => {
    const limite = parseMoney(v.lim), fecha = dia(v.fecha), vence = dia(v.vence);
    if (!v.nome.trim() || !limite || !fecha || !vence) return false;
    if (c) Object.assign(c, { nome: v.nome.trim(), limite, fecha, vence });
    else D.cards.push({ id: uid(), nome: v.nome.trim(), limite, fecha, vence });
    save();
  }),
  'del-card': id => {
    if (D.parcels.some(p => p.card === id)) return toast('Exclua antes as compras parceladas desse cartão.');
    modal('Excluir cartão?', [], () => { D.cards = D.cards.filter(x => x.id !== id); save(); });
  },
  'pay-fat': id => {
    const c = D.cards.find(x => x.id === id); if (!c) return;
    const f = fatura(c); if (!f) return toast('Esse cartão não tem parcelas em aberto.');
    const a = D.accounts.find(x => x.id === D.sel);
    modal('Pagar fatura?', [], () => {
      addTx({ desc: 'Fatura ' + c.nome, valor: f, tipo: 'Despesa', categoria: 'Cartão', acc: D.sel });
      D.parcels.forEach(p => { if (p.card === id && p.pagas < p.n) p.pagas++; });
      save();
    }, `Vai sair ${brl(f)} da conta "${a ? a.nome : ''}" e avançar uma parcela de cada compra.`);
  },
  'new-parc': () => actions.parcForm(),
  'edit-parc': id => actions.parcForm(D.parcels.find(x => x.id === id)),
  parcForm: p => {
    if (!D.cards.length) return toast('Cadastre um cartão primeiro.');
    modal(p ? 'Editar compra' : 'Nova compra parcelada', [
      { key: 'desc', label: 'O que foi comprado', value: p ? p.desc : '' },
      { key: 'card', label: 'Cartão', opts: D.cards.map(c => [c.id, c.nome]) },
      { key: 'total', label: 'Valor total (R$)', money: true, value: p ? centsToInput(p.total) : '' },
      { key: 'n', label: 'Número de parcelas', value: p ? p.n : '' },
      { key: 'pagas', label: 'Parcelas já pagas', value: p ? p.pagas : 0 }], v => {
      const total = parseMoney(v.total), n = parseInt(v.n, 10), pagas = parseInt(v.pagas, 10) || 0;
      if (!v.desc.trim() || !total || !(n >= 1) || pagas < 0 || pagas > n) return false;
      if (p) Object.assign(p, { desc: v.desc.trim(), card: v.card, total, n, pagas });
      else D.parcels.unshift({ id: uid(), desc: v.desc.trim(), card: v.card, total, n, pagas });
      save();
    });
    if (p) $('modal').querySelector('select[name=card]').value = p.card;
  },
  'del-parc': id => modal('Excluir compra parcelada?', [], () => { D.parcels = D.parcels.filter(x => x.id !== id); save(); }),
  'new-rec': () => actions.recForm(),
  'edit-rec': id => actions.recForm(D.recurring.find(x => x.id === id)),
  recForm: r => modal(r ? 'Editar conta mensal' : 'Nova conta mensal', [
    { key: 'nome', label: 'Nome (ex: Netflix, Aluguel)', value: r ? r.nome : '' },
    { key: 'valor', label: 'Valor (R$)', money: true, value: r ? centsToInput(r.valor) : '' },
    { key: 'dia', label: 'Dia do vencimento', value: r ? r.dia : '' },
    { key: 'cat', label: 'Categoria', value: r ? r.cat : 'Assinaturas' }], v => {
    const valor = parseMoney(v.valor), d = dia(v.dia);
    if (!v.nome.trim() || !valor || !d) return false;
    const cat = v.cat.trim() || 'Assinaturas';
    if (r) Object.assign(r, { nome: v.nome.trim(), valor, dia: d, cat });
    else D.recurring.push({ id: uid(), nome: v.nome.trim(), valor, dia: d, cat, paid: [] });
    save();
  }),
  'del-rec': id => modal('Excluir conta mensal?', [], () => { D.recurring = D.recurring.filter(x => x.id !== id); save(); }),
  'pay-rec': id => {
    const r = D.recurring.find(x => x.id === id); if (!r || recPago(r)) return;
    addTx({ desc: r.nome, valor: r.valor, tipo: 'Despesa', categoria: r.cat, acc: D.sel });
    r.paid.push(mes()); save();
  },
  csv: () => {
    if (!D.transactions.length) return toast('Ainda não há lançamentos para exportar.');
    const nome = id => (D.accounts.find(a => a.id === id) || { nome: '' }).nome;
    let csv = '\ufeffData;Hora;Descrição;Categoria;Tipo;Conta;Valor\n';
    D.transactions.forEach(t => {
      csv += [fmtTs(t.ts).slice(0, 10), t.ts.slice(11, 16), t.desc, t.categoria, t.tipo, nome(t.acc)].map(csvCell).join(';') + ';' + (t.valor / 100).toFixed(2).replace('.', ',') + '\n';
    });
    baixar(`kairos_lancamentos_${hoje()}.csv`, csv, 'text/csv;charset=utf-8');
  },
  json: () => baixar(`kairos_backup_${hoje()}.json`, JSON.stringify(D, null, 2), 'application/json'),
  import: () => $('file-in').click()
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) return trocarAba(tab.dataset.tab);
  if (e.target === $('modal')) return closeModal();
  const b = e.target.closest('[data-act]');
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b.dataset.id);
});

$('quick').addEventListener('submit', e => { e.preventDefault(); lancar(); });
$('acc-sel').addEventListener('change', e => { D.sel = e.target.value; save(); });
$('modal-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.target).entries());
  if (modalOk && modalOk(v) !== false) closeModal();
});
$('file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const p = JSON.parse(rd.result);
      if (!Array.isArray(p.transactions) || !Array.isArray(p.accounts)) throw 0;
      modal('Importar backup?', [], () => { D = sanitize(p); fillSal(); save(); toast('Backup importado!'); }, 'Isso substitui todos os dados atuais deste aparelho.');
    } catch (err) { toast('Arquivo inválido.'); }
  };
  rd.readAsText(f); e.target.value = '';
});

function fillSal() {
  $('sal-day-5').value = centsToInput(D.salaries.day5);
  $('sal-day-15').value = centsToInput(D.salaries.day15);
}
fillSal();
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
